services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saywith
      POSTGRES_DB: saywith
      POSTGRES_PASSWORD: ${SAYWITH_DB_PASSWORD:?Set SAYWITH_DB_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saywith -d saywith"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      SAYWITH_DATABASE_URL: postgresql+psycopg://saywith:${SAYWITH_DB_PASSWORD}@postgres:5432/saywith
      SAYWITH_MEDIA_DIR: /app/var/media
    ports: ["127.0.0.1:8083:8083"]
    volumes: ["media-data:/app/var/media"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "backend", "worker"]
    env_file: .env
    environment:
      SAYWITH_DATABASE_URL: postgresql+psycopg://saywith:${SAYWITH_DB_PASSWORD}@postgres:5432/saywith
      SAYWITH_MEDIA_DIR: /app/var/media
    volumes: ["media-data:/app/var/media"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  media-data:
