[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saywith"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.18", "jsonschema>=4.25,<5", "websockets>=15,<17", "python-dotenv>=1,<2", "PyMuPDF>=1.26,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
