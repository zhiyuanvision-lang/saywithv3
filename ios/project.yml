name: SayWithV3
options:
  bundleIdPrefix: com.saywith
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SayWithV3:
    type: application
    platform: iOS
    sources: [SayWithV3]
    info:
      path: SayWithV3/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saywith.v3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SayWith
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 录音用于英语口语练习和表现评价。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你的英语教学后端服务。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  SayWithV3Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [SayWithV3Tests]
    dependencies:
      - target: SayWithV3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SayWithV3UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SayWithV3UITests]
    dependencies:
      - target: SayWithV3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SayWithV3:
    build:
      targets:
        SayWithV3: all
    test:
      targets: [SayWithV3Tests, SayWithV3UITests]
