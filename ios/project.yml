name: SayWithV3
options:
  bundleIdPrefix: com.zhiyuanv
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "610"
targets:
  SayWithV3:
    type: application
    platform: iOS
    sources: [SayWithV3]
    info:
      path: SayWithV3/Info.plist
      properties:
        CFBundleDisplayName: 背单词练口语
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        SayWithBackendURL: "$(SAYWITH_BACKEND_URL)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [wxb9dff3017930c9ee]
        LSApplicationQueriesSchemes: [weixin, weixinULAPI, weixinURLParamsAPI]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SayWithV3/SayWithV3.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: [applinks:saywith.zhiyuanv.com]
    dependencies:
      - framework: Frameworks/WechatOpenSDK.xcframework
        embed: true
        codeSign: true
      - sdk: Security.framework
      - sdk: AuthenticationServices.framework
      - sdk: WebKit.framework
      - sdk: libc++.tbd
    settings:
      base:
        SAYWITH_BACKEND_URL: "https://api.saywith.zhiyuanv.com/learning"
        PRODUCT_BUNDLE_IDENTIFIER: com.zhiyuanv.beidanciliankouyu
        CODE_SIGN_ENTITLEMENTS: SayWithV3/SayWithV3.entitlements
        DEVELOPMENT_TEAM: "24J3ZHSPYY"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 背单词练口语
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 录音用于英语口语练习和表现评价。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你的英语教学后端服务。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  SayWithV3Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [SayWithV3Tests]
    dependencies:
      - target: SayWithV3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SayWithV3UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SayWithV3UITests]
    dependencies:
      - target: SayWithV3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SayWithV3:
    build:
      targets:
        SayWithV3: all
    test:
      targets: [SayWithV3Tests, SayWithV3UITests]
